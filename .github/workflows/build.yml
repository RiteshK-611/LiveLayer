name: Build & Release LiveLayer

on:
  push:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: ""
          - os: macos-latest
            name: macos-aarch64
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            name: macos-x64
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            name: linux-x64
            args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Publish release packages
        if: github.ref_name == 'main'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: LiveLayer v__VERSION__
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Build development packages
        if: github.ref_name == 'develop'
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Build MSIX with unplated taskbar assets
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build-msix.ps1

      - name: Attach MSIX package
        if: matrix.os == 'windows-latest' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: LiveLayer_${{ steps.version.outputs.version }}_x64.msix

      - name: Upload development packages
        if: github.ref_name == 'develop'
        uses: actions/upload-artifact@v4
        with:
          name: LiveLayer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/**/bundle/**
            LiveLayer_${{ steps.version.outputs.version }}_x64.msix
